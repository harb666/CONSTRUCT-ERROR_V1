html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-fullscreen\">
<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">
<style>
html, body, #canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
</style>
<script>
// iPhone / iPad: draw at most 2 device pixels per CSS pixel (their screens
// are 3x: 2.25x the pixels for the GPU, and much more memory). ?dpr=N
// overrides (?dpr=3 = full), for testing. Read by the crash report.
(function () {
  try {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var q = new URLSearchParams(location.search).get('dpr');
    var cap = q ? parseFloat(q) : (ios ? 2 : 0);
    var real = window.devicePixelRatio || 1;
    window.__ceDpr = { real: real, used: (cap > 0 && real > cap) ? cap : real };
    if (cap > 0 && real > cap) {
      Object.defineProperty(window, 'devicePixelRatio', { get: function () { return cap; }, configurable: true });
    }
  } catch (e) {}
})();
</script>
<script>
// iOS audio: play even with the silent switch on (Safari 16.4+), and make
// sure the Web Audio context is resumed/unlocked by a real touch.
(function () {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctxs = [];
  function Tracked(opts) { var c = opts === undefined ? new AC() : new AC(opts); ctxs.push(c); return c; }
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  function unlock() {
    ctxs.forEach(function (c) {
      if (c.state === 'running' && c.__unlocked) return;
      if (c.state !== 'running') c.resume();
      try {
        var s = c.createBufferSource();
        s.buffer = c.createBuffer(1, 1, 22050);
        s.connect(c.destination);
        s.start(0);
        c.__unlocked = true;
      } catch (e) {}
    });
  }
  ['touchstart', 'touchend', 'pointerup', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, unlock, true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) unlock(); });
})();
// Sounds start as soon as the audio is running. Godot holds every sound
// until its playback-position worklet module has loaded (it only counts how
// far each sound has played); on iPhones that can be seconds after the game
// is playable, so the first seconds were silent. Until it loads, a sound's
// position node is a stand-in that is joined to a real one the moment the
// module is ready (positions are then reported as before).
(function () {
  var T = function () { return Math.round(performance.now()) / 1000; };
  var info = window.__ceAudio = { running: -1, posReady: -1, firstSound: -1, stand_ins: 0 };
  var BS = window.AudioBufferSourceNode;
  if (BS) {
    var bstart = BS.prototype.start;
    BS.prototype.start = function () {
      if (info.firstSound < 0 && this.buffer && this.buffer.length > 1) info.firstSound = T();
      return bstart.apply(this, arguments);
    };
  }
  var AC0 = window.AudioContext;
  if (AC0) {
    var C = function (o) {
      var c = o === undefined ? new AC0() : new AC0(o);
      var m = function () { if (info.running < 0 && c.state === 'running') info.running = T(); };
      c.addEventListener('statechange', m);
      m();
      return c;
    };
    C.prototype = AC0.prototype;
    window.AudioContext = C;
    if (window.webkitAudioContext) window.webkitAudioContext = C;
  }
  if (!window.AudioWorklet || !window.AudioWorkletNode) return;
  var POS = 'godot-position-reporting-processor';
  var AWN = window.AudioWorkletNode;
  var waiting = [];
  var addModule = AudioWorklet.prototype.addModule;
  AudioWorklet.prototype.addModule = function (url, opts) {
    var wl = this;
    var p = addModule.call(wl, url, opts);
    if (String(url).indexOf('audio.position.worklet') < 0) return p;
    p.then(function () {
      wl.__ceReady = true;
      info.posReady = T();
      var w = waiting; waiting = [];
      w.forEach(function (g) { g.__ceAttach(); });
    }, function () {});
    return Promise.resolve();
  };
  function StandIn(ctx) {
    var g = ctx.createGain();
    var real = null, handler = null;
    var reset = { setValueAtTime: function (v, t) { if (real) real.parameters.get('reset').setValueAtTime(v, t); return reset; } };
    g.port = {
      postMessage: function (m) { if (real) real.port.postMessage(m); },
      get onmessage() { return handler; },
      set onmessage(f) { handler = f; if (real) real.port.onmessage = f; }
    };
    g.parameters = { get: function (k) { return k === 'reset' ? reset : undefined; } };
    // Godot disconnects a position node's outputs when it pools it: keep
    // the stand-in joined to its real node.
    g.disconnect = function () {};
    g.__ceAttach = function () {
      try { real = new AWN(ctx, POS); AudioNode.prototype.connect.call(g, real); real.port.onmessage = handler; } catch (e) {}
    };
    info.stand_ins++;
    waiting.push(g);
    return g;
  }
  function Node(ctx, name, opts) {
    if (name === POS && !(ctx.audioWorklet && ctx.audioWorklet.__ceReady)) return StandIn(ctx);
    return opts === undefined ? new AWN(ctx, name) : new AWN(ctx, name, opts);
  }
  Node.prototype = AWN.prototype;
  window.AudioWorkletNode = Node;
})();
// Start-up watch (owner: stuck on a full loading bar). After the download
// the game sets itself up in one go - the page is frozen for 15 s on a PC,
// longer on a phone - so the moment the bar fills the loading screen says
// so. Anything the engine / browser reports is listed, and a start that
// never finished (the browser stopped it) is named on the next visit.
(function () {
  var errs = [], gl = 'not started yet', lost = false, fullAt = 0, box = null, last = null;
  try { last = JSON.parse(localStorage.getItem('ce_boot') || 'null'); } catch (e) {}
  function note(m) { try { m = String(m); if (errs.length < 5 && m) { errs.push(m.slice(0, 180)); show(); } } catch (e) {} }
  window.addEventListener('error', function (e) { note(e.message || e); });
  window.addEventListener('unhandledrejection', function (e) { note(e.reason && e.reason.message ? e.reason.message : e.reason); });
  var ce = console.error;
  console.error = function () { if (fullAt) note(Array.prototype.join.call(arguments, ' ')); return ce.apply(console, arguments); };
  var gc = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (k) {
    var c = gc.apply(this, arguments);
    if (this.id === 'canvas' && String(k).indexOf('webgl') === 0) gl = c ? 'started' : 'REFUSED BY THE BROWSER';
    return c;
  };
  document.addEventListener('webglcontextlost', function () { lost = true; show(); }, true);
  function line(t, c) { var d = document.createElement('div'); d.textContent = t; if (c) d.style.color = c; box.appendChild(d); }
  function started() { var st = document.getElementById('status'); return !st || !st.parentNode; }
  function show() {
    if (started()) { if (box) box.remove(); return; }
    if (!box) {
      box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:2%;padding:0 16px;text-align:center;color:#bfefff;font:600 14px/1.45 sans-serif;z-index:99;pointer-events:none';
      document.body.appendChild(box);
    }
    box.textContent = '';
    if (last && !fullAt)
      line('Last time the game did not finish starting (the browser stopped it, usually for memory). If it happens again: close other tabs and apps, or open the link in Safari.', '#ffb347');
    if (fullAt) {
      var s = Math.round((Date.now() - fullAt) / 1000);
      line(s < 2 ? 'Downloaded. Starting the game - the screen freezes while it sets up (up to a minute on a phone)...' : 'Starting the game... ' + s + ' s');
      if (gl.indexOf('REFUSED') === 0 || lost)
        line('Graphics (WebGL) ' + (lost ? 'were lost' : 'refused') + ': close this tab, fully close the app (swipe it away), then open the link in Safari.', '#ff8080');
      else if (s >= 90)
        line('Taking too long: close this tab, fully close the app (swipe it away), then open the link in Safari.', '#ff8080');
    }
    errs.forEach(function (m) { line('error: ' + m, '#ff8080'); });
  }
  function full() {
    if (fullAt) return;
    fullAt = Date.now();
    try { localStorage.setItem('ce_boot', JSON.stringify({ at: fullAt })); } catch (e) {}
    show();
  }
  function tick() {
    if (started()) { if (box) box.remove(); try { localStorage.removeItem('ce_boot'); } catch (e) {} return; }
    show();
    setTimeout(tick, 1000);
  }
  document.addEventListener('DOMContentLoaded', function () {
    var pr = document.getElementById('status-progress');
    var d = Object.getOwnPropertyDescriptor(HTMLProgressElement.prototype, 'value');
    if (pr && d) Object.defineProperty(pr, 'value', {
      get: function () { return d.get.call(this); },
      set: function (v) { d.set.call(this, v); if (this.max > 1 && v >= this.max) full(); }
    });
    tick();
  });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
