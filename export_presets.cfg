</style>
<script>
// iOS audio: play even with the silent switch on (Safari 16.4+), and make
// sure the Web Audio context is resumed/unlocked by a real touch.
(function () {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ctxs = [];
  function Tracked(opts) { var c = opts === undefined ? new AC() : new AC(opts); ctxs.push(c); return c; }
  Tracked.prototype = AC.prototype;
  window.AudioContext = Tracked;
  if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  function unlock() {
    ctxs.forEach(function (c) {
      if (c.state === 'running' && c.__unlocked) return;
      if (c.state !== 'running') c.resume();
      try {
        var s = c.createBufferSource();
        s.buffer = c.createBuffer(1, 1, 22050);
        s.connect(c.destination);
        s.start(0);
        c.__unlocked = true;
      } catch (e) {}
    });
  }
  ['touchstart', 'touchend', 'pointerup', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, unlock, true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) unlock(); });
})();
// Sounds start as soon as the audio is running. Godot holds every sound
// until its playback-position worklet module has loaded (it only counts how
// far each sound has played); on iPhones that can be seconds after the game
// is playable, so the first seconds were silent. Until it loads, a sound's
// position node is a stand-in that is joined to a real one the moment the
// module is ready (positions are then reported as before).
(function () {
  var T = function () { return Math.round(performance.now()) / 1000; };
  var info = window.__ceAudio = { running: -1, posReady: -1, firstSound: -1, stand_ins: 0 };
  var BS = window.AudioBufferSourceNode;
  if (BS) {
    var bstart = BS.prototype.start;
    BS.prototype.start = function () {
      if (info.firstSound < 0 && this.buffer && this.buffer.length > 1) info.firstSound = T();
      return bstart.apply(this, arguments);
    };
  }
  var AC0 = window.AudioContext;
  if (AC0) {
    var C = function (o) {
      var c = o === undefined ? new AC0() : new AC0(o);
      var m = function () { if (info.running < 0 && c.state === 'running') info.running = T(); };
      c.addEventListener('statechange', m);
      m();
      return c;
    };
    C.prototype = AC0.prototype;
    window.AudioContext = C;
    if (window.webkitAudioContext) window.webkitAudioContext = C;
  }
  if (!window.AudioWorklet || !window.AudioWorkletNode) return;
  var POS = 'godot-position-reporting-processor';
  var AWN = window.AudioWorkletNode;
  var waiting = [];
  var addModule = AudioWorklet.prototype.addModule;
  AudioWorklet.prototype.addModule = function (url, opts) {
    var wl = this;
    var p = addModule.call(wl, url, opts);
    if (String(url).indexOf('audio.position.worklet') < 0) return p;
    p.then(function () {
      wl.__ceReady = true;
      info.posReady = T();
      var w = waiting; waiting = [];
      w.forEach(function (g) { g.__ceAttach(); });
    }, function () {});
    return Promise.resolve();
  };
  function StandIn(ctx) {
    var g = ctx.createGain();
    var real = null, handler = null;
    var reset = { setValueAtTime: function (v, t) { if (real) real.parameters.get('reset').setValueAtTime(v, t); return reset; } };
    g.port = {
      postMessage: function (m) { if (real) real.port.postMessage(m); },
      get onmessage() { return handler; },
      set onmessage(f) { handler = f; if (real) real.port.onmessage = f; }
    };
    g.parameters = { get: function (k) { return k === 'reset' ? reset : undefined; } };
    // Godot disconnects a position node's outputs when it pools it: keep
    // the stand-in joined to its real node.
    g.disconnect = function () {};
    g.__ceAttach = function () {
      try { real = new AWN(ctx, POS); AudioNode.prototype.connect.call(g, real); real.port.onmessage = handler; } catch (e) {}
    };
    info.stand_ins++;
    waiting.push(g);
    return g;
  }
  function Node(ctx, name, opts) {
    if (name === POS && !(ctx.audioWorklet && ctx.audioWorklet.__ceReady)) return StandIn(ctx);
    return opts === undefined ? new AWN(ctx, name) : new AWN(ctx, name, opts);
  }
  Node.prototype = AWN.prototype;
  window.AudioWorkletNode = Node;
})();
</script>"
